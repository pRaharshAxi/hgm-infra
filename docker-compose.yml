#version: '3.8'

services:

  # ─── DATABASES & INFRASTRUCTURE ───────────────────────
  postgres:
    image: postgres:16.2-alpine
    container_name: hgm_postgres
    environment:
      POSTGRES_USER: hgm_user
      POSTGRES_PASSWORD: hgm_password
      POSTGRES_DB: hgm_system_a
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hgm_user -d hgm_system_a"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - hgm_network

  mongodb:
    image: mongo:7.0
    container_name: hgm_mongodb
    init: true
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - hgm_network

  elasticsearch:
    image: elasticsearch:8.12.2
    container_name: hgm_elasticsearch
    init: true
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=hgm_elastic_password
      - xpack.security.enabled=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.ml.enabled=false # Disables heavy Machine Learning plugins to speed up boot time
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:hgm_elastic_password http://localhost:9200/_cluster/health | grep -q status"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - hgm_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hgm_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hgm_network

  redis:
    image: redis:7.2.4-alpine
    container_name: hgm_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hgm_network

  minio:
    image: quay.io/minio/minio:latest
    container_name: hgm_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - hgm_network

  # ─── CAMUNDA — Workflow Orchestration ─────────────────
  camunda:
    image: camunda/zeebe:8.5.8
    container_name: hgm_camunda
    ports:
      - "26500:26500"
      - "9600:9600"
    environment:
      - ZEEBE_BROKER_GATEWAY_ENABLE=true
      - ZEEBE_BROKER_NETWORK_HOST=0.0.0.0
      - ZEEBE_BROKER_GATEWAY_NETWORK_HOST=0.0.0.0
      - ZEEBE_BROKER_GATEWAY_NETWORK_PORT=26500
      - ZEEBE_BROKER_CLUSTER_PARTITIONSCOUNT=1
      - ZEEBE_BROKER_CLUSTER_REPLICATIONFACTOR=1
      - ZEEBE_BROKER_CLUSTER_CLUSTERSIZE=1
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
    volumes:
      - camunda_data:/usr/local/zeebe/data
    networks:
      - hgm_network
    restart: unless-stopped      

  # ─── SYSTEM A — Core Transaction Service ──────────────
  system-a:
    build:
      context: ./system-a
      dockerfile: Dockerfile
    container_name: hgm_system_a
    ports:
      - "3001:3001"
    env_file:
      - .env.integration
    environment:
      DB_HOST: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      ZEEBE_ADDRESS: camunda:26500
      CAMUNDA_SECURE_CONNECTION: "false"
      CAMUNDA_AUTH_STRATEGY: NONE
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      camunda:
        condition: service_started   
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - hgm_network
    restart: on-failure

  # ─── SYSTEM B — Discovery & Engagement Service ────────
  system-b:
    build:
      context: ./system-b
      dockerfile: Dockerfile
    container_name: hgm_system_b
    ports:
      - "3002:3000"
    env_file:
      - .env.integration
    environment:
      MONGODB_URI: mongodb://mongodb:27017/hgm_system_b
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_HOST: redis
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) process.exit(1)})"]      
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - hgm_network
    restart: on-failure

  # ─── FRONTEND ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hgm_frontend
    ports:
      - "80:80"
    depends_on:
      system-a:
        condition: service_healthy
      system-b:
        condition: service_healthy
    networks:
      - hgm_network
    restart: on-failure

volumes:
  postgres_data:
  mongodb_data:
  elasticsearch_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  camunda_data:

networks:
  hgm_network:
    driver: bridge